<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Land</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
  <div id="app">
    <h2>Land Registration Form</h2>

    <form @submit.prevent="submitForm">
      <input v-model="owner_name" placeholder="Owner Name" required>
      <input v-model="landId" placeholder="Land ID" required>
      <input v-model="location" placeholder="Location" required>
      <button type="submit">Register</button>
    </form>

    <p v-if="message">{{ message }}</p>
  </div>

  <script>
    const API_BASE = 'https://gf7naj49zi.execute-api.us-east-1.amazonaws.com/Prod';

    async function postData(endpoint, data) {
      try {
        const response = await fetch(`${API_BASE}/${endpoint}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });
        return await response.json();
      } catch (err) {
        console.error('Error posting to backend:', err);
        return { message: 'Failed to connect to backend.' };
      }
    }

    new Vue({
      el: '#app',
      data: {
        owner_name: '',
        landId: '',
        location: '',
        message: ''
      },
      methods: {
        async submitForm() {
          const payload = {
            owner_name: this.owner_name,
            landId: this.landId,
            location: this.location
          };

          const result = await postData('feeder', payload);
          this.message = result.message || 'Land registered successfully!';
          
          // Optionally reset the form
          this.owner_name = '';
          this.landId = '';
          this.location = '';
        }
      }
    });
  </script>
</body>
</html>
